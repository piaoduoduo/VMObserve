<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VMObserve · 虚拟内存实验工作台</title>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body class="workbench">
  <div class="shell">
    <aside class="sidebar" aria-label="工作台导航">
      <div class="brand">
        <svg aria-hidden="true" viewBox="0 0 32 32"><g fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="2" width="11" height="11" rx="1"/><rect x="18" y="2" width="11" height="11" rx="1"/><rect x="2" y="18" width="11" height="11" rx="1"/><rect x="18" y="18" width="11" height="11" rx="1"/></g></svg>
        <div><strong>VMObserve</strong><span>虚拟内存实验工作台</span></div>
      </div>
      <nav class="tabs" aria-label="实验主题">
        <p class="sidebar-heading">实验主题</p>
        <button data-tab="layout" aria-current="page">程序地址与映射</button>
        <button data-tab="sequence">连续分配</button>
        <button data-tab="linkage">静态与动态链接</button>
        <button data-tab="stack">栈增长对照</button>
        <button data-tab="group3">第 3 组完整实验</button>
        <button data-tab="group4">第 4 组进程与线程</button>
        <button data-tab="course">按需分配入门</button>
        <button data-tab="baseline">按需分配与写时复制</button>
        <button data-tab="thp">透明大页对照</button>
        <button data-tab="evidence">证据与环境</button>
      </nav>
      <details class="history" id="history" open>
        <summary>实验记录</summary>
        <label class="filter"><span>环境</span><select id="environment">
          <option value="all">全部环境</option><option value="openeuler">openEuler</option><option value="local">本地 / WSL</option><option value="sample">内置样例</option>
        </select></label>
        <nav id="runs" aria-label="历史实验记录"></nav>
      </details>
    </aside>
    <main class="workspace">
      <header class="toolbar">
        <a href="/lesson">动手任务 <span aria-hidden="true">↗</span></a>
        <div class="actions"><button id="export">导出报告</button><button id="run">运行基础计划</button><button id="run-course-all" hidden>运行课内全套</button></div>
      </header>
      <div class="workspace-content">
        <section class="page-heading" aria-labelledby="topic-title">
          <h1 id="topic-title">程序地址与映射</h1>
          <div class="record-meta"><p id="mode" class="mode">正在读取记录</p><p id="metadata" class="muted"></p></div>
        </section>
        <div id="job" role="status" aria-live="polite" hidden></div>
        <div id="error" role="alert" hidden></div>
        <section id="content" aria-label="实验回放"></section>
        <details class="manifest"><summary>记录完整性与源码哈希</summary><p id="integrity"></p><pre id="manifest"></pre></details>
      </div>
    </main>
  </div>
  <dialog id="raw-dialog" aria-labelledby="dialog-title">
    <div class="dialog-head"><h2 id="dialog-title">原始证据</h2><button id="close-dialog">关闭</button></div>
    <div id="dialog-body"></div>
  </dialog>
</body>
</html>
