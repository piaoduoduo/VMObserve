<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VMObserve · 华科 OS 虚拟内存实验台</title>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
<div class="app-frame">
  <aside class="course-rail" aria-label="课程实验目录">
    <div class="rail-brand">
      <svg aria-hidden="true" viewBox="0 0 32 32"><g fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="11" height="11" rx="2"/><rect x="18" y="3" width="11" height="11" rx="2"/><rect x="3" y="18" width="11" height="11" rx="2"/><rect x="18" y="18" width="11" height="11" rx="2"/></g></svg>
      <div>
        <strong>VMObserve</strong>
        <span>HUST OS 虚拟内存实验台</span>
      </div>
    </div>

    <nav class="rail-nav" role="tablist" aria-label="实验章节">
      <div class="rail-group">
        <span class="rail-group-title">实验三 · 内存管理</span>
        <button role="tab" data-tab="sequence" aria-selected="true"><em>3.2</em>连续三次 malloc</button>
        <button role="tab" data-tab="layout" aria-selected="false"><em>3.1</em>程序地址都在哪</button>
        <button role="tab" data-tab="course" aria-selected="false"><em>3.3</em>按需分配入门</button>
        <button role="tab" data-tab="baseline" aria-selected="false"><em>拓展</em>写时复制 COW</button>
        <button role="tab" data-tab="thp" aria-selected="false"><em>拓展</em>透明大页 THP</button>
        <button role="tab" data-tab="group3" aria-selected="false"><em>3.1–3</em>链接、调页与栈</button>
      </div>

      <div class="rail-group">
        <span class="rail-group-title">实验四 · 进程与线程</span>
        <button role="tab" data-tab="group4" aria-selected="false"><em>4.x</em>进程、线程与同步</button>
      </div>

      <div class="rail-group">
        <span class="rail-group-title">动手与证据</span>
        <button role="tab" data-tab="evidence" aria-selected="false"><em>RAW</em>原始记录</button>
        <a class="rail-link" href="/lesson"><em>LAB</em>动手改代码</a>
      </div>
    </nav>

    <div class="rail-footer">
      <button id="run" class="rail-btn primary">采集新实验数据</button>
      <button id="export" class="rail-btn">导出实验报告</button>
    </div>
  </aside>

  <div class="stage-shell">
    <header class="stage-bar">
      <div class="dataset-bar">
        <span class="dataset-label">当前回放记录</span>
        <button id="toggle-runs" class="dataset-pill" aria-expanded="false" aria-controls="runs-drawer">
          <span id="mode">正在读取记录</span>
          <span class="pill-caret">换一份数据 ▾</span>
        </button>
        <span id="metadata" class="meta-text"></span>
      </div>
      <div class="share-bar">
        <span id="copy-status" role="status"></span>
        <button id="copy-replay" class="share-btn" disabled>复制当前步骤链接</button>
      </div>
    </header>

    <main class="stage-main">
      <h1 id="page-title" hidden>VMObserve</h1>
      <div id="job" role="status" aria-live="polite" hidden></div>
      <div id="error" role="alert" hidden></div>
      <section id="content" aria-live="polite"></section>
      <details class="manifest">
        <summary>底层记录核对</summary>
        <p id="integrity"></p>
        <details class="manifest-sub"><summary>展开源码与文件哈希</summary><pre id="manifest"></pre></details>
      </details>
    </main>
  </div>
</div>

<div id="drawer-backdrop" class="drawer-backdrop" hidden></div>
<aside id="runs-drawer" class="runs-drawer" aria-label="切换实验记录" hidden>
  <div class="drawer-head">
    <div>
      <h2>切换历史实验记录</h2>
      <p>想对比 openEuler 和 Ubuntu 的区别，可以在这里切换记录</p>
    </div>
    <button id="close-drawer">关闭</button>
  </div>
  <label class="filter">环境筛选：
    <select id="environment">
      <option value="all">全部环境</option>
      <option value="example">课内内置样例</option>
      <option value="openeuler">openEuler 虚拟机</option>
      <option value="local">本地 / WSL</option>
    </select>
  </label>
  <nav id="runs" aria-label="实验记录列表"></nav>
</aside>

<dialog id="raw-dialog">
  <div class="dialog-head">
    <h2 id="dialog-title">原始证据</h2>
    <button id="close-dialog">关闭</button>
  </div>
  <div id="dialog-body"></div>
</dialog>
</body>
</html>
